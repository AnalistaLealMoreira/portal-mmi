{% extends "base.html" %}
{% block title %}Recuperar acesso{% endblock %}
{% block content %}
<div class="auth-card mx-auto" style="max-width: 480px;">
    <h1 class="h4 mb-2">Recuperar acesso</h1>
    <p class="text-muted">Informe o e-mail cadastrado para receber o link de redefinição da senha.</p>
    <form method="post">
        {% csrf_token %}
        {% include "_form_fields.html" %}
        <button type="submit" class="btn btn-primary">Enviar link</button>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary">Voltar</a>
    </form>
</div>
{% endblock %}
